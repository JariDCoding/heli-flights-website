<meta charset="utf-8">
<title>Cadeaubon Luchtdoop — Bestellen · Heli-Flights</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --red:#AD0404; --red-dark:#8A0303;
    --ink:#1E1C1D; --white:#FFFFFF; --ground:#F3F3F4;
    --muted:#6E6C6D; --line:#DEDEDF; --line-2:#CBCBCC;
    --tint:#FBEDED;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:17px; line-height:1.5; overflow:hidden;
  }
  .app{height:100dvh; display:flex; flex-direction:column;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line); background:var(--white); flex:none;
  }
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.02em; font-size:15px;}
  .logo .mark{height:30px; width:auto; display:block; border-radius:3px;}
  .logo span{color:var(--muted); font-weight:700;}
  .step-count{font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--ink); font-variant-numeric:tabular-nums;}
  .step-count em{color:var(--muted); font-style:normal; font-weight:700;}

  /* segmented step indicator */
  .steps{display:flex; gap:4px; padding:12px 28px; background:var(--white); border-bottom:1px solid var(--line); flex:none;}
  .steps .seg{height:4px; flex:1; background:var(--line); border-radius:2px; transition:background .3s;}
  .steps .seg.done{background:var(--red);}

  .stage{flex:1; overflow-y:auto; display:flex; align-items:center; justify-content:center; padding:32px 24px;}
  .screen{width:100%; max-width:720px; margin:0 auto;}
  .screen.enter{animation:rise .4s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){ .screen.enter{animation:none;} .steps .seg{transition:none;} }

  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:800;
    letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-bottom:16px;}
  .eyebrow .sq{width:9px; height:9px; background:var(--red);}
  .eyebrow em{color:var(--muted); font-style:normal; font-weight:700;}

  /* Titles: H2 scale; display treatment only on impact words */
  h1.q{font-weight:500; letter-spacing:-.01em; line-height:1.12; font-size:clamp(24px,3.4vw,38px); text-wrap:balance;}
  h1.q .imp{font-weight:800; text-transform:uppercase; letter-spacing:-.01em;}
  .q-help{color:var(--muted); font-size:16px; margin-top:14px; max-width:56ch;}

  .options{display:grid; gap:12px; margin-top:30px;}
  .opt{display:flex; align-items:center; gap:16px; width:100%; text-align:left;
    background:var(--white); border:1.5px solid var(--line); border-radius:3px;
    padding:18px 20px; cursor:pointer; font-family:inherit; font-size:17px; color:var(--ink);
    transition:border-color .15s, background .15s, transform .05s;}
  .opt:hover{border-color:var(--line-2);}
  .opt:active{transform:translateY(1px);}
  .opt .key{width:26px; height:26px; flex:none; border:1.5px solid var(--line-2); border-radius:3px;
    display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--muted);}
  .opt .txt{flex:1;}
  .opt .txt b{display:block; font-weight:700; letter-spacing:.01em;}
  .opt .txt small{color:var(--muted); font-size:13.5px; font-weight:400;}
  .opt .tick{width:22px; height:22px; flex:none; opacity:0; transition:opacity .15s;}
  .opt[aria-checked="true"]{border-color:var(--red); background:var(--tint);}
  .opt[aria-checked="true"] .key{background:var(--red); color:#fff; border-color:var(--red);}
  .opt[aria-checked="true"] .tick{opacity:1;}
  .opt.multi .key{border-radius:4px;}

  .stepper{display:flex; align-items:center; gap:22px; margin-top:34px;}
  .stepper button{width:56px; height:56px; border:1.5px solid var(--line-2); background:var(--white);
    border-radius:3px; font-size:26px; font-weight:600; cursor:pointer; color:var(--ink); font-family:inherit;}
  .stepper button:hover{border-color:var(--red); color:var(--red);}
  .stepper .val{font-size:56px; font-weight:800; min-width:70px; text-align:center; font-variant-numeric:tabular-nums;}
  .stepper .unit{color:var(--muted); font-size:15px;}

  .field{margin-top:22px;}
  .field label{display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  .field input{width:100%; padding:15px 16px; font-family:inherit; font-size:17px; color:var(--ink);
    background:var(--white); border:1.5px solid var(--line-2); border-radius:3px;}
  .field textarea{width:100%; padding:15px 16px; font-family:inherit; font-size:17px; color:var(--ink);
    background:var(--white); border:1.5px solid var(--line-2); border-radius:3px; resize:vertical; min-height:120px; line-height:1.5;}
  .field input::placeholder,.field textarea::placeholder{color:#b3b1b2;}
  .field input:focus,.field textarea:focus{outline:none; border-color:var(--red);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:560px){ .form-grid{grid-template-columns:1fr;} }

  /* prijs-highlight */
  .price-hi{display:flex; align-items:baseline; gap:14px; margin-top:26px;
    background:var(--white); border:1.5px solid var(--line); border-left:3px solid var(--red);
    border-radius:3px; padding:20px 24px;}
  .price-hi .k{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  .price-hi .v{font-size:38px; font-weight:800; letter-spacing:-.01em; color:var(--ink); line-height:1; margin-left:auto;}
  .price-hi .s{font-size:13px; color:var(--muted); font-weight:600;}

  .info-box{margin-top:26px; background:var(--white); border:1.5px solid var(--line); border-left:3px solid var(--red); border-radius:3px; padding:22px 24px;}
  .info-box ul{list-style:none; display:grid; gap:12px;}
  .info-box li{display:flex; gap:12px; font-size:15px;}
  .info-box li .sq{width:8px; height:8px; background:var(--red); margin-top:7px; flex:none;}
  .info-note{margin-top:16px; font-size:13.5px; color:var(--muted);}

  .summary{margin-top:26px; background:var(--white); border:1.5px solid var(--line); border-radius:3px; overflow:hidden;}
  .summary .row{display:flex; justify-content:space-between; gap:16px; padding:15px 22px; border-bottom:1px solid var(--line); font-size:15px;}
  .summary .row:last-child{border-bottom:none;}
  .summary .row .k{color:var(--muted); font-weight:600;}
  .summary .row .v{font-weight:700; text-align:right;}
  .reassure{display:flex; gap:12px; margin-top:20px; padding:16px 20px; background:var(--tint); border-radius:3px; font-size:14px;}
  .reassure .sq{width:9px;height:9px;background:var(--red);margin-top:5px;flex:none;}

  .footer{display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 28px; border-top:1px solid var(--line); background:var(--white); flex:none;}
  .btn{font-family:inherit; font-weight:700; font-size:16px; cursor:pointer; border-radius:3px;
    padding:15px 30px; border:1.5px solid transparent; letter-spacing:.01em; display:inline-flex; align-items:center; gap:10px;}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-primary:disabled{background:var(--line-2); color:#fff; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:transparent; padding-left:6px;}
  .btn-ghost:hover{color:var(--red);}
  .btn-ghost:disabled{opacity:0; pointer-events:none;}
  .hint{font-size:12px; color:var(--muted); margin-left:12px;}
  .hint b{color:var(--ink);}
  @media(max-width:560px){
    .hint{display:none;}
    .btn{padding:14px 22px; font-size:15px;}
    .topbar,.footer,.steps{padding-left:18px; padding-right:18px;}
    .stage{padding:24px 18px;}
    .price-hi .v{font-size:30px;}
  }
</style>

<script>
const state = {
  bontype:null, ontv_naam:'', adres:'', postcode:'', gemeente:'',
  boodschap:'', voor_wie:'', voornaam:'', achternaam:'', email:'', tel:''
};

// ── Waar de bestelling naartoe gaat. Vul in met je CRM-webhook of Zapier catch-hook.
//    Leeg = de bestelling wordt in de console gelogd (voor testen).
const SUBMIT_ENDPOINT = ''; // bv. 'https://crm.heli-flights.be/api/leads'

function buildSteps(){
  const s = [];
  s.push({id:'bontype', type:'single', label:'Bon', q:'Digitaal of <span class="imp">fysiek</span>?',
    help:'Een luchtdoop cadeau: een gedeelde helikoptervlucht van ± 15 minuten boven Antwerpen.',
    options:[
      {v:'digitaal', b:'Digitale bon — €150', s:'Pdf per e-mail met QR-code, meteen te versturen'},
      {v:'fysiek', b:'Fysieke bon — €160', s:'Verzorgde bon met QR-code, per post bezorgd (incl. verzending)'},
    ]});
  if(state.bontype==='fysiek'){
    s.push({id:'bezorging', type:'address', label:'Bezorging', q:'Waar mogen we de <span class="imp">bon</span> naartoe sturen?',
      help:'We sturen de verzorgde cadeaubon per post naar dit adres.'});
  }
  s.push({id:'boodschap', type:'message', optional:true, label:'Boodschap', q:'Een <span class="imp">boodschap</span> erbij?',
    help:'Optioneel — voeg een persoonlijk woordje toe bij de bon.'});
  s.push({id:'contact', type:'form', label:'Gegevens', q:'Waar mogen we je <span class="imp">bereiken</span>?',
    help:'We bellen je op om je bestelling te bevestigen en de bon te bezorgen.'});
  s.push({id:'overzicht', type:'summary', label:'Overzicht', q:'Klaar om te <span class="imp">bestellen</span>?',
    help:'Check even je keuzes. We ronden alles telefonisch met je af.'});
  return s;
}

let steps = buildSteps();
let i = 0;

const stage = document.getElementById('stage');
const stepsBar = document.getElementById('stepsBar');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const stepCount = document.getElementById('stepCount');
const hint = document.getElementById('hint');

const tickSVG = '<svg class="tick" width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11.5l4.5 4.5L18 6" stroke="#AD0404" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function esc(s){return (s||'').replace(/</g,'&lt;');}

function render(){
  steps = buildSteps();
  if(i>=steps.length) i=steps.length-1;
  const step = steps[i];
  stage.scrollTop = 0;

  // step indicator
  stepsBar.innerHTML = steps.map((s,k)=>`<span class="seg${k<=i?' done':''}"></span>`).join('');
  stepCount.innerHTML = 'STAP ' + (i+1) + ' <em>/ ' + steps.length + '</em>';

  let html = '<div class="screen enter">';
  html += `<span class="eyebrow"><span class="sq"></span>${esc(step.label)}${step.optional?' <em>· optioneel</em>':''}</span>`;
  html += `<h1 class="q">${step.q}</h1>`;
  if(step.help) html += `<p class="q-help">${esc(step.help)}</p>`;

  if(step.type==='single'){
    html += '<div class="options">';
    step.options.forEach((o,idx)=>{
      const cur = state[step.id];
      const on = cur===o.v;
      html += `<button class="opt" data-v="${o.v}" aria-checked="${on}">
        <span class="key">${String.fromCharCode(65+idx)}</span>
        <span class="txt"><b>${esc(o.b)}</b>${o.s?`<small>${esc(o.s)}</small>`:''}</span>
        ${tickSVG}</button>`;
    });
    html += '</div>';
  }
  else if(step.type==='address'){
    html += `<div class="field"><label>Naam ontvanger</label><input id="ontv_naam" value="${esc(state.ontv_naam)}" placeholder="Naam ontvanger"></div>
      <div class="field"><label>Straat + nummer</label><input id="adres" value="${esc(state.adres)}" placeholder="Havenweg 12"></div>
      <div class="form-grid">
        <div class="field"><label>Postcode</label><input id="postcode" value="${esc(state.postcode)}" placeholder="2000"></div>
        <div class="field"><label>Gemeente</label><input id="gemeente" value="${esc(state.gemeente)}" placeholder="Antwerpen"></div>
      </div>`;
  }
  else if(step.type==='message'){
    html += `<div class="field"><label>Persoonlijke boodschap <span style="text-transform:none;letter-spacing:0;font-weight:600">(optioneel)</span></label><textarea id="boodschap" placeholder="Schrijf een woordje voor de gelukkige…">${esc(state.boodschap)}</textarea></div>
      <div class="field"><label>Voor wie is het? <span style="text-transform:none;letter-spacing:0;font-weight:600">(optioneel)</span></label><input id="voor_wie" value="${esc(state.voor_wie)}" placeholder="bv. Voor mama"></div>`;
  }
  else if(step.type==='form'){
    html += `<div class="form-grid">
        <div class="field"><label>Voornaam</label><input id="voornaam" value="${esc(state.voornaam)}" placeholder="Voornaam"></div>
        <div class="field"><label>Achternaam</label><input id="achternaam" value="${esc(state.achternaam)}" placeholder="Achternaam"></div>
      </div>
      <div class="field"><label>Telefoonnummer</label><input id="tel" type="tel" value="${esc(state.tel)}" placeholder="+32 4.."></div>
      <div class="field"><label>E-mail <span style="text-transform:none;letter-spacing:0;font-weight:600">(optioneel)</span></label><input id="email" type="email" value="${esc(state.email)}" placeholder="jouw@email.be"></div>`;
  }
  else if(step.type==='summary'){
    const isFys = state.bontype==='fysiek';
    const prijs = isFys ? '€160' : '€150';
    const bonLabel = isFys ? 'Fysieke bon — €160' : 'Digitale bon — €150';
    const prijsNoot = isFys ? 'incl. verzending' : 'pdf per e-mail';
    const adresLabel = [state.ontv_naam, state.adres, ((state.postcode||'')+' '+(state.gemeente||'')).trim()].filter(x=>x && x.trim()).join(', ');
    html += `<div class="price-hi"><span class="k">Te betalen</span><span class="v">${prijs}</span><span class="s">${prijsNoot}</span></div>`;
    html += `<div class="summary">
      <div class="row"><span class="k">Bon</span><span class="v">${bonLabel}</span></div>`;
    if(isFys) html += `<div class="row"><span class="k">Bezorgadres</span><span class="v">${esc(adresLabel||'—')}</span></div>`;
    html += `<div class="row"><span class="k">Voor wie</span><span class="v">${esc(state.voor_wie||'—')}</span></div>
    </div>
    <div class="reassure"><span class="sq"></span><span><b>De bon is 24 maanden geldig.</b> De begunstigde scant de QR-code, kiest een eerste zondag van de maand en geeft naam + gewicht door voor een veilige belading. Wij bellen je op om de bestelling af te ronden.</span></div>`;
  }

  html += '</div>';
  stage.innerHTML = html;

  stage.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>{
      const v = el.dataset.v;
      state[step.id]=v;
      setTimeout(()=>{ if(i<steps.length-1){ i++; } render(); }, 180);
      updateNav();
    });
  });
  ['ontv_naam','adres','postcode','gemeente','boodschap','voor_wie','voornaam','achternaam','email','tel'].forEach(id=>{const el=stage.querySelector('#'+id); if(el) el.oninput=e=>{state[id]=e.target.value; updateNav();};});

  updateNav();
}

function stepValid(){
  const step = steps[i];
  if(step.optional || step.type==='summary') return true;
  if(step.type==='single') return !!state[step.id];
  if(step.type==='address') return state.ontv_naam.trim() && state.adres.trim() && state.postcode.trim() && state.gemeente.trim();
  if(step.type==='form') return state.voornaam.trim() && state.achternaam.trim() && state.tel.trim().length>=6;
  return true;
}

function updateNav(){
  backBtn.disabled = (i===0);
  nextBtn.textContent = (i===steps.length-1) ? 'Bestel je bon →' : 'Volgende';
  nextBtn.disabled = !stepValid();
  hint.style.visibility = stepValid()? 'visible':'hidden';
}

function next(){
  if(!stepValid()) return;
  if(i===steps.length-1){ submitBestelling(); return; }
  i++; nextBtn.style.display=''; render();
}
function back(){ if(i>0){ i--; nextBtn.style.display=''; render(); } }

async function submitBestelling(){
  nextBtn.disabled=true; nextBtn.textContent='Versturen…'; hint.style.visibility='hidden';
  const payload = { ...state, bron:'cadeaubon-luchtdoop', besteld_op:new Date().toISOString() };
  let ok = true;
  if(SUBMIT_ENDPOINT){
    try{ const r = await fetch(SUBMIT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); ok=r.ok; }
    catch(e){ ok=false; }
  } else { console.log('[Heli-Flights] Bestelling (geen SUBMIT_ENDPOINT ingesteld):', payload); }
  ok ? showSuccess() : showError();
}

function showSuccess(){
  const voornaam=(state.voornaam||'').trim();
  const isFys = state.bontype==='fysiek';
  stepsBar.innerHTML = steps.map(()=>`<span class="seg done"></span>`).join('');
  stage.innerHTML = `<div class="screen enter" style="text-align:center;max-width:560px;">
    <span class="eyebrow" style="justify-content:center;width:100%"><span class="sq"></span>Bestelling ontvangen</span>
    <h1 class="q" style="text-align:center">Een vlucht cadeau${voornaam?', '+esc(voornaam):''} — <span class="imp">geregeld</span>.</h1>
    <p class="q-help" style="margin-left:auto;margin-right:auto">We bellen je binnenkort op${state.tel? ' op <b>'+esc(state.tel)+'</b>':''} om je bestelling te bevestigen en de ${isFys?'fysieke bon per post te bezorgen':'digitale bon per e-mail te versturen'}. De bon is 24 maanden geldig.</p>
  </div>`;
  backBtn.style.display='none'; nextBtn.style.display='none'; hint.style.visibility='hidden';
  stepCount.textContent='VERZONDEN';
}
function showError(){
  stage.innerHTML = `<div class="screen enter" style="max-width:560px;">
    <span class="eyebrow"><span class="sq"></span>Er ging iets mis</span>
    <h1 class="q">Bestelling <span class="imp">niet verstuurd</span></h1>
    <p class="q-help">Probeer het opnieuw. Lukt het niet, bel ons dan rechtstreeks — we helpen je meteen verder.</p>
  </div>`;
  nextBtn.style.display=''; nextBtn.disabled=false; nextBtn.textContent='Opnieuw proberen →'; hint.style.visibility='hidden';
}

nextBtn.addEventListener('click',next);
backBtn.addEventListener('click',back);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !nextBtn.disabled && nextBtn.style.display!=='none'){ next(); }
  if(e.key==='Escape'){ back(); }
});

render();
</script>
