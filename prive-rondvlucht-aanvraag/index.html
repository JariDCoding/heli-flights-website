<meta charset="utf-8">
<title>Privé Rondvlucht — Aanvraag · Heli-Flights</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --red:#AD0404; --red-dark:#8A0303;
    --ink:#1E1C1D; --white:#FFFFFF; --ground:#F3F3F4;
    --muted:#6E6C6D; --line:#DEDEDF; --line-2:#CBCBCC;
    --tint:#FBEDED;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:17px; line-height:1.5; overflow:hidden;
  }
  .app{height:100dvh; display:flex; flex-direction:column;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line); background:var(--white); flex:none;
  }
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.02em; font-size:15px;}
  .logo .mark{height:30px; width:auto; display:block; border-radius:3px;}
  .logo span{color:var(--muted); font-weight:700;}
  .step-count{font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--ink); font-variant-numeric:tabular-nums;}
  .step-count em{color:var(--muted); font-style:normal; font-weight:700;}

  /* segmented step indicator */
  .steps{display:flex; gap:4px; padding:12px 28px; background:var(--white); border-bottom:1px solid var(--line); flex:none;}
  .steps .seg{height:4px; flex:1; background:var(--line); border-radius:2px; transition:background .3s;}
  .steps .seg.done{background:var(--red);}

  .stage{flex:1; overflow-y:auto; display:flex; align-items:center; justify-content:center; padding:32px 24px;}
  .screen{width:100%; max-width:720px; margin:0 auto;}
  .screen.enter{animation:rise .4s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){ .screen.enter{animation:none;} .steps .seg{transition:none;} }

  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:800;
    letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-bottom:16px;}
  .eyebrow .sq{width:9px; height:9px; background:var(--red);}
  .eyebrow em{color:var(--muted); font-style:normal; font-weight:700;}

  /* Titles: H2 scale; display treatment only on impact words */
  h1.q{font-weight:500; letter-spacing:-.01em; line-height:1.12; font-size:clamp(24px,3.4vw,38px); text-wrap:balance;}
  h1.q .imp{font-weight:800; text-transform:uppercase; letter-spacing:-.01em;}
  .q-help{color:var(--muted); font-size:16px; margin-top:14px; max-width:56ch;}

  .options{display:grid; gap:12px; margin-top:30px;}
  .opt{display:flex; align-items:center; gap:16px; width:100%; text-align:left;
    background:var(--white); border:1.5px solid var(--line); border-radius:3px;
    padding:18px 20px; cursor:pointer; font-family:inherit; font-size:17px; color:var(--ink);
    transition:border-color .15s, background .15s, transform .05s;}
  .opt:hover{border-color:var(--line-2);}
  .opt:active{transform:translateY(1px);}
  .opt .key{width:26px; height:26px; flex:none; border:1.5px solid var(--line-2); border-radius:3px;
    display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--muted);}
  .opt .txt{flex:1;}
  .opt .txt b{display:block; font-weight:700; letter-spacing:.01em;}
  .opt .txt small{color:var(--muted); font-size:13.5px; font-weight:400;}
  .opt .tick{width:22px; height:22px; flex:none; opacity:0; transition:opacity .15s;}
  .opt[aria-checked="true"]{border-color:var(--red); background:var(--tint);}
  .opt[aria-checked="true"] .key{background:var(--red); color:#fff; border-color:var(--red);}
  .opt[aria-checked="true"] .tick{opacity:1;}
  .opt.multi .key{border-radius:4px;}

  .stepper{display:flex; align-items:center; gap:22px; margin-top:34px;}
  .stepper button{width:56px; height:56px; border:1.5px solid var(--line-2); background:var(--white);
    border-radius:3px; font-size:26px; font-weight:600; cursor:pointer; color:var(--ink); font-family:inherit;}
  .stepper button:hover{border-color:var(--red); color:var(--red);}
  .stepper .val{font-size:56px; font-weight:800; min-width:70px; text-align:center; font-variant-numeric:tabular-nums;}
  .stepper .unit{color:var(--muted); font-size:15px;}

  .field{margin-top:22px;}
  .field label{display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  .field input{width:100%; padding:15px 16px; font-family:inherit; font-size:17px; color:var(--ink);
    background:var(--white); border:1.5px solid var(--line-2); border-radius:3px;}
  .field input::placeholder{color:#b3b1b2;}
  .field input:focus{outline:none; border-color:var(--red);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:560px){ .form-grid{grid-template-columns:1fr;} }

  /* Calendly-style calendar */
  .cal{background:var(--white); border:1.5px solid var(--line); border-radius:4px; padding:18px; max-width:390px; margin-top:26px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-title{font-weight:800; font-size:16px; letter-spacing:.01em; text-transform:capitalize;}
  .cal-nav{width:36px;height:36px;border:1.5px solid var(--line-2); background:var(--white); border-radius:3px; cursor:pointer; font-size:18px; color:var(--ink); line-height:1;}
  .cal-nav:hover:not(:disabled){border-color:var(--red); color:var(--red);}
  .cal-nav:disabled{opacity:.3; cursor:not-allowed;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-dow{margin-bottom:8px;}
  .cal-dowc{text-align:center; font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--muted); text-transform:uppercase;}
  .cal-day{aspect-ratio:1; border:1.5px solid transparent; background:var(--white); border-radius:3px; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--ink); display:flex; align-items:center; justify-content:center;}
  .cal-day:hover:not(:disabled){border-color:var(--red); color:var(--red);}
  .cal-day:disabled{color:#d2d2d3; cursor:not-allowed;}
  .cal-day.sel{background:var(--red); color:#fff; border-color:var(--red);}
  .cal-empty{aspect-ratio:1;}

  .toggle-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .chip{padding:11px 16px; border:1.5px solid var(--line-2); background:var(--white); border-radius:999px;
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; color:var(--ink);}
  .chip[aria-pressed="true"]{border-color:var(--red); background:var(--tint); color:var(--red);}

  .info-box{margin-top:26px; background:var(--white); border:1.5px solid var(--line); border-left:3px solid var(--red); border-radius:3px; padding:22px 24px;}
  .info-box ul{list-style:none; display:grid; gap:12px;}
  .info-box li{display:flex; gap:12px; font-size:15px;}
  .info-box li .sq{width:8px; height:8px; background:var(--red); margin-top:7px; flex:none;}
  .info-note{margin-top:16px; font-size:13.5px; color:var(--muted);}

  .summary{margin-top:26px; background:var(--white); border:1.5px solid var(--line); border-radius:3px; overflow:hidden;}
  .summary .row{display:flex; justify-content:space-between; gap:16px; padding:15px 22px; border-bottom:1px solid var(--line); font-size:15px;}
  .summary .row:last-child{border-bottom:none;}
  .summary .row .k{color:var(--muted); font-weight:600;}
  .summary .row .v{font-weight:700; text-align:right;}
  .reassure{display:flex; gap:12px; margin-top:20px; padding:16px 20px; background:var(--tint); border-radius:3px; font-size:14px;}
  .reassure .sq{width:9px;height:9px;background:var(--red);margin-top:5px;flex:none;}

  .footer{display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 28px; border-top:1px solid var(--line); background:var(--white); flex:none;}
  .btn{font-family:inherit; font-weight:700; font-size:16px; cursor:pointer; border-radius:3px;
    padding:15px 30px; border:1.5px solid transparent; letter-spacing:.01em; display:inline-flex; align-items:center; gap:10px;}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-primary:disabled{background:var(--line-2); color:#fff; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:transparent; padding-left:6px;}
  .btn-ghost:hover{color:var(--red);}
  .btn-ghost:disabled{opacity:0; pointer-events:none;}
  .hint{font-size:12px; color:var(--muted); margin-left:12px;}
  .hint b{color:var(--ink);}
  @media(max-width:560px){
    .hint{display:none;}
    .btn{padding:14px 22px; font-size:15px;}
    .topbar,.footer,.steps{padding-left:18px; padding-right:18px;}
    .stage{padding:24px 18px;}
  }
</style>

<script>
const state = {
  vertrek:null, route:null, duur:null, personen:2, datum:'', flexibel:false,
  extras:[], gelegenheid:null, voornaam:'', achternaam:'', email:'', tel:''
};

// ── Waar de aanvraag naartoe gaat. Vul in met je CRM-webhook of Zapier catch-hook.
//    Leeg = de aanvraag wordt in de console gelogd (voor testen).
const SUBMIT_ENDPOINT = ''; // bv. 'https://crm.heli-flights.be/api/leads'

const routeSets = {
  antwerpen:[
    {v:'skyline', b:'Skyline & Schelde', s:'Het Steen · kathedraal · MAS · Havenhuis'},
    {v:'haven', b:'Haven & Forten', s:'De haven · de dokken · de fortengordel'},
  ],
  kust:[
    {v:'kustlijn', b:'Kustlijn Knokke–Oostende', s:'Zwin · Knokke · Blankenberge · Zeebrugge'},
    {v:'brugge', b:'Brugge & Zwin', s:'Historisch Brugge · het Zwin · de duinen'},
  ],
  eigen:[]
};

function buildSteps(){
  const s = [];
  s.push({id:'vertrek', type:'single', label:'Vertrek', q:'Vanwaar wil je <span class="imp">vertrekken</span>?',
    help:'Kies de dichtstbijzijnde basis, of vertrek vanaf je eigen locatie.',
    options:[
      {v:'antwerpen', b:'Regio Antwerpen', s:'Ranst · Nijlen · Lier · Ravels'},
      {v:'kust', b:'Regio Kust', s:'Zeebrugge · Knokke'},
      {v:'eigen', b:'Eigen locatie', s:'Pickup & dropoff op maat'},
    ]});
  if(state.vertrek==='eigen'){
    s.push({id:'voorwaarden', type:'info', label:'Eigen locatie', q:'Even dit over je <span class="imp">eigen locatie</span>',
      help:'Vertrek of landing op je eigen terrein kan, als het aan deze voorwaarden voldoet:',
      items:[
        'Een vrij terrein van minstens 30 × 15 meter',
        'Een obstakelvrije aan- en uitvliegroute (geen hoge bomen, kabels of masten)',
        'Een vaste, egale ondergrond zonder los materiaal',
        'Schriftelijke toelating van de eigenaar of huurder',
      ],
      note:'Goed om te weten: de vliegtijd van en naar je locatie (vanaf onze basis) telt mee in de totale vluchttijd.'});
  }
  const rs = state.vertrek ? routeSets[state.vertrek].slice() : [];
  const routeOpts = rs.concat([
    {v:'zelf', b:'Ik stippel zelf uit', s:'Over je huis, je bedrijf, of een plek die iets betekent'},
    {v:'advies', b:'Laat ons adviseren', s:'We stellen samen de mooiste route voor'},
  ]);
  s.push({id:'route', type:'single', label:'Route', q:'Welke <span class="imp">route</span> wil je vliegen?',
    help: state.vertrek==='eigen' ? 'Bepaal vrij je route binnen de toegelaten luchtruimtes.' : 'Kies een uitgewerkte klassieker, of stippel je eigen route uit.',
    options: routeOpts});
  s.push({id:'duur', type:'single', label:'Duur', q:'Hoe lang wil je <span class="imp">in de lucht</span>?',
    help:'Elke privévlucht duurt minstens 30 minuten. Een langere, volledig eigen route stippelen we samen uit.',
    options:[
      {v:'30', b:'30 minuten', s:'De klassieke rondvlucht'},
      {v:'45', b:'45 minuten', s:'Wat meer tijd boven de mooiste plekken'},
      {v:'60', b:'60 minuten', s:'Uitgebreid, alle tijd'},
      {v:'langer', b:'Langer / op maat', s:'We bespreken je volledige route'},
    ]});
  s.push({id:'personen', type:'stepper', label:'Gezelschap', q:'Met hoeveel <span class="imp">personen</span> vliegen jullie?',
    help:'Je boekt de hele helikopter — lege plaatsen tellen mee. Na de reservatie bevestigen we het exacte gewicht.'});
  s.push({id:'wanneer', type:'date', label:'Datum', q:'Wanneer wil je <span class="imp">vliegen</span>?',
    help:'Kies je voorkeursdatum. Definitief tijdstip en go/no-go stemmen we af met de beschikbaarheid.'});
  s.push({id:'extras', type:'multi', label:'Extra’s', q:'Wil je er iets <span class="imp">speciaals</span> van maken?',
    help:'Optioneel. Onze troef: we verzorgen dit ook op locatie.',
    options:[
      {v:'champagne', b:'Champagne op locatie', s:'Een toast op de grond, voor of na de vlucht'},
      {v:'gopro', b:'GoPro aan boord', s:'Legt de volledige vlucht vast — neemt geen plaats in'},
      {v:'cameraman', b:'Professionele cameraman', s:'Cinematische beelden (neemt één plaats in)'},
      {v:'reportage', b:'Fotoreportage op locatie', s:'Aankomst, landing en het moment op de grond'},
    ]});
  s.push({id:'gelegenheid', type:'single', optional:true, label:'Gelegenheid', q:'Voor welke <span class="imp">gelegenheid</span>?',
    help:'Optioneel — helpt ons je vlucht persoonlijker te maken.',
    options:[
      {v:'cadeau', b:'Een cadeau', s:''},
      {v:'romantisch', b:'Romantisch moment', s:''},
      {v:'familie', b:'Familie & vrienden', s:''},
      {v:'zakelijk', b:'Zakelijk / VIP', s:''},
      {v:'droom', b:'Gewoon een droom', s:''},
    ]});
  s.push({id:'contact', type:'form', label:'Jouw gegevens', q:'Hoe mogen we je <span class="imp">bereiken</span>?',
    help:'We bellen je op om je vlucht te bespreken en te bevestigen.'});
  s.push({id:'bevestig', type:'summary', label:'Overzicht', q:'Klaar om <span class="imp">aan te vragen</span>?',
    help:'Check even je keuzes. Je zit nog nergens aan vast.'});
  return s;
}

let steps = buildSteps();
let i = 0;
let calMonth, calYear;

const stage = document.getElementById('stage');
const stepsBar = document.getElementById('stepsBar');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const stepCount = document.getElementById('stepCount');
const hint = document.getElementById('hint');

const tickSVG = '<svg class="tick" width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11.5l4.5 4.5L18 6" stroke="#AD0404" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function esc(s){return (s||'').replace(/</g,'&lt;');}

const MONTHS=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const DOW=['ma','di','wo','do','vr','za','zo'];

function initCal(){
  const t=new Date();
  if(state.datum){ const d=new Date(state.datum+'T00:00'); calYear=d.getFullYear(); calMonth=d.getMonth(); }
  else { calYear=t.getFullYear(); calMonth=t.getMonth(); }
}
function drawCal(){
  const wrap=document.getElementById('calWrap'); if(!wrap) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const first=new Date(calYear,calMonth,1);
  const start=(first.getDay()+6)%7;           // Monday-first
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const atCurrent=(calYear===today.getFullYear() && calMonth===today.getMonth());
  let h=`<div class="cal">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" ${atCurrent?'disabled':''} aria-label="vorige maand">‹</button>
      <div class="cal-title">${MONTHS[calMonth]} ${calYear}</div>
      <button class="cal-nav" id="calNext" aria-label="volgende maand">›</button>
    </div>
    <div class="cal-grid cal-dow">`;
  DOW.forEach(d=>h+=`<span class="cal-dowc">${d}</span>`);
  h+=`</div><div class="cal-grid">`;
  for(let b=0;b<start;b++) h+=`<span class="cal-empty"></span>`;
  for(let d=1;d<=dim;d++){
    const dt=new Date(calYear,calMonth,d);
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const past=dt<today;
    const sel=state.datum===iso;
    h+=`<button class="cal-day${sel?' sel':''}" ${past?'disabled':''} data-iso="${iso}">${d}</button>`;
  }
  h+=`</div></div>`;
  wrap.innerHTML=h;
  wrap.querySelector('#calPrev').onclick=()=>{ if(calMonth===0){calMonth=11;calYear--;}else calMonth--; drawCal(); };
  wrap.querySelector('#calNext').onclick=()=>{ if(calMonth===11){calMonth=0;calYear++;}else calMonth++; drawCal(); };
  wrap.querySelectorAll('.cal-day:not([disabled])').forEach(b=>b.onclick=()=>{
    state.datum=b.dataset.iso; state.flexibel=false;
    const fc=document.getElementById('flexChip'); if(fc) fc.setAttribute('aria-pressed','false');
    drawCal(); updateNav();
  });
}

function render(){
  steps = buildSteps();
  if(i>=steps.length) i=steps.length-1;
  const step = steps[i];
  stage.scrollTop = 0;

  // step indicator
  stepsBar.innerHTML = steps.map((s,k)=>`<span class="seg${k<=i?' done':''}"></span>`).join('');
  stepCount.innerHTML = 'STAP ' + (i+1) + ' <em>/ ' + steps.length + '</em>';

  let html = '<div class="screen enter">';
  html += `<span class="eyebrow"><span class="sq"></span>${esc(step.label)}${step.optional?' <em>· optioneel</em>':''}</span>`;
  html += `<h1 class="q">${step.q}</h1>`;
  if(step.help) html += `<p class="q-help">${esc(step.help)}</p>`;

  if(step.type==='single'){
    html += '<div class="options">';
    step.options.forEach((o,idx)=>{
      const cur = (step.id==='gelegenheid')?state.gelegenheid:state[step.id];
      const on = cur===o.v;
      html += `<button class="opt" data-v="${o.v}" aria-checked="${on}">
        <span class="key">${String.fromCharCode(65+idx)}</span>
        <span class="txt"><b>${esc(o.b)}</b>${o.s?`<small>${esc(o.s)}</small>`:''}</span>
        ${tickSVG}</button>`;
    });
    html += '</div>';
  }
  else if(step.type==='multi'){
    html += '<div class="options">';
    step.options.forEach((o)=>{
      const on = state.extras.includes(o.v);
      html += `<button class="opt multi" data-v="${o.v}" aria-checked="${on}">
        <span class="key">${on?'✓':''}</span>
        <span class="txt"><b>${esc(o.b)}</b>${o.s?`<small>${esc(o.s)}</small>`:''}</span>
        ${tickSVG}</button>`;
    });
    html += '</div>';
  }
  else if(step.type==='stepper'){
    html += `<div class="stepper">
      <button data-act="dec" aria-label="minder">−</button>
      <div><span class="val" id="pval">${state.personen}</span></div>
      <button data-act="inc" aria-label="meer">+</button>
      <span class="unit">personen</span></div>`;
  }
  else if(step.type==='date'){
    html += `<div id="calWrap"></div>
      <div class="toggle-row">
        <button class="chip" id="flexChip" aria-pressed="${state.flexibel}">Ik ben flexibel / last-minute</button>
      </div>`;
  }
  else if(step.type==='info'){
    html += '<div class="info-box"><ul>';
    step.items.forEach(it=>{ html += `<li><span class="sq"></span><span>${esc(it)}</span></li>`; });
    html += `</ul></div><p class="info-note">${esc(step.note)}</p>`;
  }
  else if(step.type==='form'){
    html += `<div class="form-grid">
        <div class="field"><label>Voornaam</label><input id="voornaam" value="${esc(state.voornaam)}" placeholder="Voornaam"></div>
        <div class="field"><label>Achternaam</label><input id="achternaam" value="${esc(state.achternaam)}" placeholder="Achternaam"></div>
      </div>
      <div class="field"><label>Telefoonnummer</label><input id="tel" type="tel" value="${esc(state.tel)}" placeholder="+32 4.."></div>
      <div class="field"><label>E-mail <span style="text-transform:none;letter-spacing:0;font-weight:600">(optioneel)</span></label><input id="email" type="email" value="${esc(state.email)}" placeholder="jouw@email.be"></div>`;
  }
  else if(step.type==='summary'){
    const dur = ({'30':'30 minuten','45':'45 minuten','60':'60 minuten','langer':'Op maat'})[state.duur]||'—';
    const findLabel=(set,v)=>{const a=(set||[]).find(x=>x.v===v);return a?a.b:null;};
    let routeLabel = findLabel(routeSets[state.vertrek],state.route) ||
      ({'zelf':'Zelf uitgestippeld','advies':'Advies gevraagd'})[state.route] || '—';
    const vertrekLabel = ({'antwerpen':'Regio Antwerpen','kust':'Regio Kust','eigen':'Eigen locatie'})[state.vertrek]||'—';
    const extrasLabel = state.extras.length ? state.extras.map(e=>({champagne:'Champagne',gopro:'GoPro',cameraman:'Cameraman',reportage:'Fotoreportage'})[e]).join(' · ') : 'Geen';
    html += `<div class="summary">
      <div class="row"><span class="k">Vertrek</span><span class="v">${vertrekLabel}</span></div>
      <div class="row"><span class="k">Route</span><span class="v">${esc(routeLabel)}</span></div>
      <div class="row"><span class="k">Duur</span><span class="v">${dur}</span></div>
      <div class="row"><span class="k">Personen</span><span class="v">${state.personen}</span></div>
      <div class="row"><span class="k">Datum</span><span class="v">${state.datum||(state.flexibel?'Flexibel':'—')}</span></div>
      <div class="row"><span class="k">Extra's</span><span class="v">${esc(extrasLabel)}</span></div>
    </div>
    <div class="reassure"><span class="sq"></span><span><b>Je zit nog nergens aan vast.</b> We bellen je binnenkort op om alles te bespreken en je vlucht te bevestigen. Bij slecht weer boeken we gratis om.</span></div>`;
  }

  html += '</div>';
  stage.innerHTML = html;

  if(step.type==='date'){ if(calYear===undefined) initCal(); drawCal(); }

  stage.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>{
      const v = el.dataset.v;
      if(step.type==='multi'){
        const idx = state.extras.indexOf(v);
        if(idx>=0) state.extras.splice(idx,1); else state.extras.push(v);
        render();
      } else {
        if(step.id==='gelegenheid') state.gelegenheid=v; else state[step.id]=v;
        setTimeout(()=>{ if(i<steps.length-1){ i++; } render(); }, 180);
      }
      updateNav();
    });
  });
  const dec=stage.querySelector('[data-act="dec"]'), inc=stage.querySelector('[data-act="inc"]');
  if(dec) dec.onclick=()=>{ state.personen=Math.max(1,state.personen-1); document.getElementById('pval').textContent=state.personen; };
  if(inc) inc.onclick=()=>{ state.personen=state.personen+1; document.getElementById('pval').textContent=state.personen; };
  const flex=stage.querySelector('#flexChip'); if(flex) flex.onclick=()=>{
    state.flexibel=!state.flexibel; if(state.flexibel) state.datum='';
    flex.setAttribute('aria-pressed',state.flexibel); drawCal(); updateNav();
  };
  ['voornaam','achternaam','email','tel'].forEach(id=>{const el=stage.querySelector('#'+id); if(el) el.oninput=e=>{state[id]=e.target.value; updateNav();};});

  updateNav();
}

function stepValid(){
  const step = steps[i];
  if(step.optional || step.type==='info' || step.type==='multi' || step.type==='stepper' || step.type==='summary') return true;
  if(step.type==='single') return !!(step.id==='gelegenheid'?state.gelegenheid:state[step.id]);
  if(step.type==='date') return !!(state.datum || state.flexibel);
  if(step.type==='form') return state.voornaam.trim() && state.achternaam.trim() && state.tel.trim().length>=6;
  return true;
}

function updateNav(){
  backBtn.disabled = (i===0);
  nextBtn.textContent = (i===steps.length-1) ? 'Vraag je vlucht aan →' : 'Volgende';
  nextBtn.disabled = !stepValid();
  hint.style.visibility = stepValid()? 'visible':'hidden';
}

function next(){
  if(!stepValid()) return;
  if(i===steps.length-1){ submitAanvraag(); return; }
  i++; nextBtn.style.display=''; render();
}
function back(){ if(i>0){ i--; nextBtn.style.display=''; render(); } }

async function submitAanvraag(){
  nextBtn.disabled=true; nextBtn.textContent='Versturen…'; hint.style.visibility='hidden';
  const payload = { ...state, bron:'prive-rondvlucht', aangevraagd_op:new Date().toISOString() };
  let ok = true;
  if(SUBMIT_ENDPOINT){
    try{ const r = await fetch(SUBMIT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); ok=r.ok; }
    catch(e){ ok=false; }
  } else { console.log('[Heli-Flights] Aanvraag (geen SUBMIT_ENDPOINT ingesteld):', payload); }
  ok ? showSuccess() : showError();
}

function showSuccess(){
  const voornaam=(state.voornaam||'').trim();
  stepsBar.innerHTML = steps.map(()=>`<span class="seg done"></span>`).join('');
  stage.innerHTML = `<div class="screen enter" style="text-align:center;max-width:560px;">
    <span class="eyebrow" style="justify-content:center;width:100%"><span class="sq"></span>Aanvraag verzonden</span>
    <h1 class="q" style="text-align:center">Tot in de <span class="imp">lucht</span>${voornaam?', '+esc(voornaam):''}.</h1>
    <p class="q-help" style="margin-left:auto;margin-right:auto">We bellen je binnenkort op${state.tel? ' op <b>'+esc(state.tel)+'</b>':''} om je vlucht te bespreken en te bevestigen. Bij slecht weer boeken we gratis om.</p>
  </div>`;
  backBtn.style.display='none'; nextBtn.style.display='none'; hint.style.visibility='hidden';
  stepCount.textContent='VERZONDEN';
}
function showError(){
  stage.innerHTML = `<div class="screen enter" style="max-width:560px;">
    <span class="eyebrow"><span class="sq"></span>Er ging iets mis</span>
    <h1 class="q">Aanvraag <span class="imp">niet verstuurd</span></h1>
    <p class="q-help">Probeer het opnieuw. Lukt het niet, bel ons dan rechtstreeks — we helpen je meteen verder.</p>
  </div>`;
  nextBtn.style.display=''; nextBtn.disabled=false; nextBtn.textContent='Opnieuw proberen →'; hint.style.visibility='hidden';
}

nextBtn.addEventListener('click',next);
backBtn.addEventListener('click',back);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !nextBtn.disabled && nextBtn.style.display!=='none'){ next(); }
  if(e.key==='Escape'){ back(); }
});

render();
</script>
