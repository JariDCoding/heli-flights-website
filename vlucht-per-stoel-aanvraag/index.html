<meta charset="utf-8">
<title>Vlucht per stoel — Reserveren · Heli-Flights</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --red:#AD0404; --red-dark:#8A0303;
    --ink:#1E1C1D; --white:#FFFFFF; --ground:#F3F3F4;
    --muted:#6E6C6D; --line:#DEDEDF; --line-2:#CBCBCC;
    --tint:#FBEDED;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:17px; line-height:1.5; overflow:hidden;
  }
  .app{height:100dvh; display:flex; flex-direction:column;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line); background:var(--white); flex:none;
  }
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.02em; font-size:15px;}
  .logo .mark{height:30px; width:auto; display:block; border-radius:3px;}
  .logo span{color:var(--muted); font-weight:700;}
  .step-count{font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--ink); font-variant-numeric:tabular-nums;}
  .step-count em{color:var(--muted); font-style:normal; font-weight:700;}

  /* segmented step indicator */
  .steps{display:flex; gap:4px; padding:12px 28px; background:var(--white); border-bottom:1px solid var(--line); flex:none;}
  .steps .seg{height:4px; flex:1; background:var(--line); border-radius:2px; transition:background .3s;}
  .steps .seg.done{background:var(--red);}

  .stage{flex:1; overflow-y:auto; display:flex; align-items:center; justify-content:center; padding:32px 24px;}
  .screen{width:100%; max-width:720px; margin:0 auto;}
  .screen.enter{animation:rise .4s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){ .screen.enter{animation:none;} .steps .seg{transition:none;} }

  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:800;
    letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-bottom:16px;}
  .eyebrow .sq{width:9px; height:9px; background:var(--red);}
  .eyebrow em{color:var(--muted); font-style:normal; font-weight:700;}

  /* Titles: H2 scale; display treatment only on impact words */
  h1.q{font-weight:500; letter-spacing:-.01em; line-height:1.12; font-size:clamp(24px,3.4vw,38px); text-wrap:balance;}
  h1.q .imp{font-weight:800; text-transform:uppercase; letter-spacing:-.01em;}
  .q-help{color:var(--muted); font-size:16px; margin-top:14px; max-width:56ch;}

  .options{display:grid; gap:12px; margin-top:30px;}
  .opt{display:flex; align-items:center; gap:16px; width:100%; text-align:left;
    background:var(--white); border:1.5px solid var(--line); border-radius:3px;
    padding:18px 20px; cursor:pointer; font-family:inherit; font-size:17px; color:var(--ink);
    transition:border-color .15s, background .15s, transform .05s;}
  .opt:hover{border-color:var(--line-2);}
  .opt:active{transform:translateY(1px);}
  .opt .key{width:26px; height:26px; flex:none; border:1.5px solid var(--line-2); border-radius:3px;
    display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--muted);}
  .opt .txt{flex:1;}
  .opt .txt b{display:block; font-weight:700; letter-spacing:.01em;}
  .opt .txt small{color:var(--muted); font-size:13.5px; font-weight:400;}
  .opt .tick{width:22px; height:22px; flex:none; opacity:0; transition:opacity .15s;}
  .opt[aria-checked="true"]{border-color:var(--red); background:var(--tint);}
  .opt[aria-checked="true"] .key{background:var(--red); color:#fff; border-color:var(--red);}
  .opt[aria-checked="true"] .tick{opacity:1;}
  .opt.multi .key{border-radius:4px;}

  /* seat picker — top-down EC120 */
  .seat-count{display:flex; gap:10px; margin-top:12px;}
  .seat-count button{flex:1; padding:15px 0; border:1.5px solid var(--line-2); background:var(--white);
    border-radius:3px; font-family:inherit; font-weight:800; font-size:19px; cursor:pointer; color:var(--ink);
    transition:border-color .15s, background .15s, color .15s;}
  .seat-count button:hover{border-color:var(--line-2);}
  .seat-count button[aria-pressed="true"]{border-color:var(--red); background:var(--tint); color:var(--red);}

  .heli{max-width:320px; margin:30px auto 0;}
  .heli-rotor{position:relative; height:38px; margin-bottom:-4px;}
  .heli-rotor span{position:absolute; left:50%; top:50%; width:190px; height:4px; background:var(--line-2); border-radius:2px;}
  .heli-rotor span:nth-child(1){transform:translate(-50%,-50%) rotate(34deg);}
  .heli-rotor span:nth-child(2){transform:translate(-50%,-50%) rotate(-34deg);}
  .heli-rotor i{position:absolute; left:50%; top:50%; width:15px; height:15px; border-radius:50%;
    background:var(--line-2); transform:translate(-50%,-50%);}
  .heli-body{background:var(--white); border:1.5px solid var(--line); border-radius:130px 130px 26px 26px;
    padding:34px 22px 24px; position:relative;}
  .heli-front{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  .heli-rear{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px;}
  .seat{aspect-ratio:1; border-radius:11px; border:1.5px solid var(--line-2); background:var(--ground);
    display:flex; align-items:center; justify-content:center; font-family:inherit; font-weight:800;
    font-size:20px; color:var(--muted); cursor:pointer; transition:background .15s, border-color .15s, color .15s;}
  .seat:hover{border-color:var(--red);}
  .seat.occupied{background:var(--red); border-color:var(--red); color:#fff;}
  .seat.pilot{background:var(--ink); border-color:var(--ink); color:#fff; cursor:default;
    font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;}
  .heli-tail{width:22px; height:44px; background:var(--white); border:1.5px solid var(--line); border-top:none;
    border-radius:0 0 9px 9px; margin:-1px auto 0; position:relative;}
  .heli-tail i{position:absolute; bottom:-10px; left:50%; transform:translateX(-50%); width:18px; height:18px;
    border-radius:50%; background:var(--white); border:1.5px solid var(--line);}
  .price-tag{text-align:center; margin-top:26px;}
  .price-tag .amt{font-weight:800; font-size:clamp(44px,8vw,62px); line-height:1; color:var(--ink); font-variant-numeric:tabular-nums;}
  .price-tag .lbl{color:var(--muted); font-size:14.5px; font-weight:600; margin-top:8px;}

  /* passengers — name + weight (W&B) */
  .pax{display:grid; gap:16px; margin-top:28px;}
  .pax-card{background:var(--white); border:1.5px solid var(--line); border-radius:3px; padding:18px 20px 20px;}
  .pax-head{display:flex; align-items:center; gap:11px; margin-bottom:14px;}
  .pax-num{width:28px; height:28px; border-radius:50%; background:var(--red); color:#fff; flex:none;
    display:grid; place-items:center; font-weight:800; font-size:14px;}
  .pax-title{font-weight:800; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink);}
  .pax-weight{margin-top:16px;}
  .pax-wtop{display:flex; align-items:baseline; justify-content:space-between;}
  .pax-wtop .lab{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  .pax-wtop .num{font-weight:800; font-size:26px; font-variant-numeric:tabular-nums; display:inline-flex; align-items:baseline; gap:3px;}
  .pax-wtop .num i{font-size:14px; color:var(--muted); font-weight:700; font-style:normal;}
  .slider{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px; background:var(--line); outline:none; margin-top:14px;}
  .slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:28px; height:28px; border-radius:50%;
    background:var(--red); cursor:pointer; border:3px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.28);}
  .slider::-moz-range-thumb{width:28px; height:28px; border-radius:50%; background:var(--red); cursor:pointer; border:3px solid #fff;}
  .slider-ends{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-weight:600; margin-top:8px;}

  .field{margin-top:22px;}
  .field label{display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  .field input{width:100%; padding:15px 16px; font-family:inherit; font-size:17px; color:var(--ink);
    background:var(--white); border:1.5px solid var(--line-2); border-radius:3px;}
  .field input::placeholder{color:#b3b1b2;}
  .field input:focus{outline:none; border-color:var(--red);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:560px){ .form-grid{grid-template-columns:1fr;} }

  /* Calendly-style calendar */
  .cal{background:var(--white); border:1.5px solid var(--line); border-radius:4px; padding:18px; max-width:390px; margin-top:26px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-title{font-weight:800; font-size:16px; letter-spacing:.01em; text-transform:capitalize;}
  .cal-nav{width:36px;height:36px;border:1.5px solid var(--line-2); background:var(--white); border-radius:3px; cursor:pointer; font-size:18px; color:var(--ink); line-height:1;}
  .cal-nav:hover:not(:disabled){border-color:var(--red); color:var(--red);}
  .cal-nav:disabled{opacity:.3; cursor:not-allowed;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-dow{margin-bottom:8px;}
  .cal-dowc{text-align:center; font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--muted); text-transform:uppercase;}
  .cal-day{aspect-ratio:1; border:1.5px solid transparent; background:var(--white); border-radius:3px; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--ink); display:flex; align-items:center; justify-content:center;}
  .cal-day:hover:not(:disabled){border-color:var(--red); color:var(--red);}
  .cal-day:disabled{color:#d2d2d3; cursor:not-allowed;}
  .cal-day.sel{background:var(--red); color:#fff; border-color:var(--red);}
  .cal-empty{aspect-ratio:1;}

  .suggest-label{display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:26px; margin-bottom:12px;}
  .date-suggest{display:flex; gap:10px; flex-wrap:wrap;}
  .dsug{padding:11px 15px; border:1.5px solid var(--line-2); background:var(--white); border-radius:3px; cursor:pointer; font-family:inherit; text-align:left; line-height:1.25; color:var(--ink);}
  .dsug small{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
  .dsug b{font-size:15px; font-weight:700;}
  .dsug[aria-pressed="true"]{border-color:var(--red); background:var(--tint); color:var(--red);}
  .dsug[aria-pressed="true"] small{color:var(--red);}
  .suggest-note{font-size:12.5px; color:var(--muted); margin-top:12px;}
  .cal-or{display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:24px;}
  .toggle-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .chip{padding:11px 16px; border:1.5px solid var(--line-2); background:var(--white); border-radius:999px;
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; color:var(--ink);}
  .chip[aria-pressed="true"]{border-color:var(--red); background:var(--tint); color:var(--red);}

  .summary{margin-top:26px; background:var(--white); border:1.5px solid var(--line); border-radius:3px; overflow:hidden;}
  .summary .row{display:flex; justify-content:space-between; gap:16px; padding:15px 22px; border-bottom:1px solid var(--line); font-size:15px;}
  .summary .row:last-child{border-bottom:none;}
  .summary .row .k{color:var(--muted); font-weight:600;}
  .summary .row .v{font-weight:700; text-align:right;}
  .reassure{display:flex; gap:12px; margin-top:20px; padding:16px 20px; background:var(--tint); border-radius:3px; font-size:14px;}
  .reassure .sq{width:9px;height:9px;background:var(--red);margin-top:5px;flex:none;}

  .footer{display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 28px; border-top:1px solid var(--line); background:var(--white); flex:none;}
  .btn{font-family:inherit; font-weight:700; font-size:16px; cursor:pointer; border-radius:3px;
    padding:15px 30px; border:1.5px solid transparent; letter-spacing:.01em; display:inline-flex; align-items:center; gap:10px;}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-primary:disabled{background:var(--line-2); color:#fff; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:transparent; padding-left:6px;}
  .btn-ghost:hover{color:var(--red);}
  .btn-ghost:disabled{opacity:0; pointer-events:none;}
  .hint{font-size:12px; color:var(--muted); margin-left:12px;}
  .hint b{color:var(--ink);}
  @media(max-width:560px){
    .hint{display:none;}
    .btn{padding:14px 22px; font-size:15px;}
    .topbar,.footer,.steps{padding-left:18px; padding-right:18px;}
    .stage{padding:24px 18px;}
  }
</style>

<script>
const state = {
  aantal:1,
  passengers:[{naam:'',gewicht:80}],
  datum:'', flexibel:false,
  voornaam:'', achternaam:'', email:'', tel:''
};

// ── Waar de reservatie naartoe gaat. Vul in met je CRM-webhook of Zapier catch-hook.
//    Leeg = de reservatie wordt in de console gelogd (voor testen).
const SUBMIT_ENDPOINT = ''; // bv. 'https://crm.heli-flights.be/api/leads'

function syncPassengers(){
  const arr = state.passengers;
  while(arr.length < state.aantal) arr.push({naam:'', gewicht:80});
  while(arr.length > state.aantal) arr.pop();
}

function buildSteps(){
  const s = [];
  s.push({id:'seats', type:'seats', label:'Stoelen', q:'Hoeveel <span class="imp">stoelen</span> wil je?',
    help:'Je boekt per stoel — €150 per persoon. Een vlucht vertrekt bij 4 volzette stoelen; raakt ze niet vol, dan schuift je stoel door naar een volgende eerste zondag.'});
  s.push({id:'passengers', type:'passengers', label:'Passagiers', q:'Wie gaat er <span class="imp">mee</span>?',
    help:'We noteren per passagier de naam en het gewicht. Dat hebben we nodig voor een veilige, evenwichtige belading (weight & balance).'});
  s.push({id:'wanneer', type:'date', label:'Datum', q:'Wanneer wil je <span class="imp">vliegen</span>?',
    help:'Vluchten gaan door op de eerste zondag van de maand. Vertrek vanaf Ranst, Nijlen of Lier — definitieve locatie en uur bevestigen we 1–2 dagen vooraf.'});
  s.push({id:'contact', type:'form', label:'Contact', q:'Waar mogen we je <span class="imp">bereiken</span>?',
    help:'We bellen je op om je stoel(en) te bevestigen.'});
  s.push({id:'bevestig', type:'summary', label:'Overzicht', q:'Klaar om je <span class="imp">stoel</span> te reserveren?',
    help:'Check even je keuzes. Je zit nog nergens aan vast.'});
  return s;
}

let steps = buildSteps();
let i = 0;
let calMonth, calYear;

const stage = document.getElementById('stage');
const stepsBar = document.getElementById('stepsBar');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const stepCount = document.getElementById('stepCount');
const hint = document.getElementById('hint');

function esc(s){return (s||'').replace(/</g,'&lt;');}

const MONTHS=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const DOW=['ma','di','wo','do','vr','za','zo'];
const MN=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];

function setSlider(el){const min=+el.min,max=+el.max,v=+el.value; const pct=((v-min)/(max-min))*100;
  el.style.background=`linear-gradient(to right, var(--red) 0%, var(--red) ${pct}%, var(--line) ${pct}%, var(--line) 100%)`;}

// Voorgestelde momenten = de eerstvolgende 3 eerste-zondagen van de maand.
function suggestedDates(){
  const out=[]; const today=new Date(); today.setHours(0,0,0,0);
  let y=today.getFullYear(), m=today.getMonth(), guard=0;
  while(out.length<3 && guard<24){ guard++;
    const first=new Date(y,m,1);
    const day=1+((7-first.getDay())%7);          // eerste zondag (zo=0)
    const d=new Date(y,m,day);
    if(d>=today){
      const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      out.push({iso, wd:'zondag', lbl:`${day} ${MN[m]}`});
    }
    m++; if(m>11){m=0;y++;}
  }
  return out;
}
function fmtDatum(iso){ const d=new Date(iso+'T00:00'); return `zondag ${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()}`; }

function initCal(){
  const t=new Date();
  if(state.datum){ const d=new Date(state.datum+'T00:00'); calYear=d.getFullYear(); calMonth=d.getMonth(); }
  else { calYear=t.getFullYear(); calMonth=t.getMonth(); }
}
function drawCal(){
  const wrap=document.getElementById('calWrap'); if(!wrap) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const first=new Date(calYear,calMonth,1);
  const start=(first.getDay()+6)%7;           // Monday-first
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const atCurrent=(calYear===today.getFullYear() && calMonth===today.getMonth());
  let h=`<div class="cal">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" ${atCurrent?'disabled':''} aria-label="vorige maand">‹</button>
      <div class="cal-title">${MONTHS[calMonth]} ${calYear}</div>
      <button class="cal-nav" id="calNext" aria-label="volgende maand">›</button>
    </div>
    <div class="cal-grid cal-dow">`;
  DOW.forEach(d=>h+=`<span class="cal-dowc">${d}</span>`);
  h+=`</div><div class="cal-grid">`;
  for(let b=0;b<start;b++) h+=`<span class="cal-empty"></span>`;
  for(let d=1;d<=dim;d++){
    const dt=new Date(calYear,calMonth,d);
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const past=dt<today;
    const sel=state.datum===iso;
    h+=`<button class="cal-day${sel?' sel':''}" ${past?'disabled':''} data-iso="${iso}">${d}</button>`;
  }
  h+=`</div></div>`;
  wrap.innerHTML=h;
  wrap.querySelector('#calPrev').onclick=()=>{ if(calMonth===0){calMonth=11;calYear--;}else calMonth--; drawCal(); };
  wrap.querySelector('#calNext').onclick=()=>{ if(calMonth===11){calMonth=0;calYear++;}else calMonth++; drawCal(); };
  wrap.querySelectorAll('.cal-day:not([disabled])').forEach(b=>b.onclick=()=>{
    state.datum=b.dataset.iso; state.flexibel=false;
    const fc=document.getElementById('flexChip'); if(fc) fc.setAttribute('aria-pressed','false');
    drawCal(); updateNav();
  });
}

function seatHTML(n){
  const occ = n<=state.aantal;
  return `<button class="seat${occ?' occupied':''}" data-seat="${n}" aria-label="stoel ${n}">${n}</button>`;
}

function render(){
  steps = buildSteps();
  if(i>=steps.length) i=steps.length-1;
  const step = steps[i];
  stage.scrollTop = 0;

  // step indicator
  stepsBar.innerHTML = steps.map((s,k)=>`<span class="seg${k<=i?' done':''}"></span>`).join('');
  stepCount.innerHTML = 'STAP ' + (i+1) + ' <em>/ ' + steps.length + '</em>';

  let html = '<div class="screen enter">';
  html += `<span class="eyebrow"><span class="sq"></span>${esc(step.label)}${step.optional?' <em>· optioneel</em>':''}</span>`;
  html += `<h1 class="q">${step.q}</h1>`;
  if(step.help) html += `<p class="q-help">${esc(step.help)}</p>`;

  if(step.type==='seats'){
    html += `<span class="suggest-label" style="margin-top:30px">Aantal plaatsen</span><div class="seat-count">`;
    [1,2,3,4].forEach(n=>{ html+=`<button data-aantal="${n}" aria-pressed="${state.aantal===n}">${n}</button>`; });
    html += `</div>
      <div class="heli">
        <div class="heli-rotor"><span></span><span></span><i></i></div>
        <div class="heli-body">
          <div class="heli-front"><div class="seat pilot">Piloot</div>${seatHTML(4)}</div>
          <div class="heli-rear">${seatHTML(1)}${seatHTML(2)}${seatHTML(3)}</div>
        </div>
        <div class="heli-tail"><i></i></div>
      </div>`;
    const total = state.aantal*150;
    html += `<div class="price-tag"><div class="amt">€${total}</div><div class="lbl">${state.aantal} ${state.aantal>1?'stoelen':'stoel'} × €150</div></div>`;
  }
  else if(step.type==='passengers'){
    syncPassengers();
    html += '<div class="pax">';
    state.passengers.forEach((p,idx)=>{
      html += `<div class="pax-card">
        <div class="pax-head"><span class="pax-num">${idx+1}</span><span class="pax-title">Passagier ${idx+1}</span></div>
        <div class="field" style="margin-top:0"><label>Naam</label><input class="pax-naam" data-idx="${idx}" value="${esc(p.naam)}" placeholder="Naam van de passagier"></div>
        <div class="pax-weight">
          <div class="pax-wtop"><span class="lab">Gewicht</span><span class="num"><span class="pax-wval" data-idx="${idx}">${p.gewicht}</span><i>kg</i></span></div>
          <input type="range" min="50" max="140" step="1" value="${p.gewicht}" class="slider pax-slider" data-idx="${idx}" aria-label="gewicht passagier ${idx+1}">
          <div class="slider-ends"><span>50 kg</span><span>140 kg</span></div>
        </div>
      </div>`;
    });
    html += `</div><p class="suggest-note" style="margin-top:20px">Max ± 120 kg per persoon voor een veilige en evenwichtige belading. We houden hier intern rekening mee (weight &amp; balance).</p>`;
  }
  else if(step.type==='date'){
    let sug='<span class="suggest-label">Voorgestelde momenten</span><div class="date-suggest">';
    suggestedDates().forEach(s=>{ sug+=`<button class="dsug" data-iso="${s.iso}" aria-pressed="${state.datum===s.iso}"><small>${s.wd}</small><b>${s.lbl}</b></button>`; });
    sug+='</div><p class="suggest-note">Onder voorbehoud — de definitieve datum bevestigen we op basis van onze planning.</p>';
    html += sug + `<span class="cal-or">Of kies zelf een datum</span><div id="calWrap"></div>
      <div class="toggle-row">
        <button class="chip" id="flexChip" aria-pressed="${state.flexibel}">Ik ben flexibel / last-minute</button>
      </div>`;
  }
  else if(step.type==='form'){
    html += `<div class="form-grid">
        <div class="field"><label>Voornaam</label><input id="voornaam" value="${esc(state.voornaam)}" placeholder="Voornaam"></div>
        <div class="field"><label>Achternaam</label><input id="achternaam" value="${esc(state.achternaam)}" placeholder="Achternaam"></div>
      </div>
      <div class="field"><label>Telefoonnummer</label><input id="tel" type="tel" value="${esc(state.tel)}" placeholder="+32 4.."></div>
      <div class="field"><label>E-mail <span style="text-transform:none;letter-spacing:0;font-weight:600">(optioneel)</span></label><input id="email" type="email" value="${esc(state.email)}" placeholder="jouw@email.be"></div>`;
  }
  else if(step.type==='summary'){
    const total = state.aantal*150;
    const namen = state.passengers.map(p=>p.naam.trim()).filter(Boolean).join(', ') || '—';
    const datumLabel = state.datum ? fmtDatum(state.datum) : (state.flexibel?'Flexibel':'—');
    html += `<div class="summary">
      <div class="row"><span class="k">Aantal stoelen</span><span class="v">${state.aantal}</span></div>
      <div class="row"><span class="k">Totaal</span><span class="v">€${total}</span></div>
      <div class="row"><span class="k">Passagiers</span><span class="v">${esc(namen)}</span></div>
      <div class="row"><span class="k">Datum</span><span class="v">${esc(datumLabel)}</span></div>
    </div>
    <div class="reassure"><span class="sq"></span><span><b>Je zit nog nergens definitief aan vast.</b> We bellen je op om je stoel(en) te bevestigen. De vlucht vertrekt bij 4 volzette stoelen; bij slecht weer of onvolledige vulling schuift je stoel door naar een volgende eerste zondag (binnen 24 maanden).</span></div>`;
  }

  html += '</div>';
  stage.innerHTML = html;

  if(step.type==='seats'){
    stage.querySelectorAll('[data-aantal]').forEach(b=>b.onclick=()=>{ state.aantal=+b.dataset.aantal; syncPassengers(); render(); });
    stage.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{ state.aantal=+b.dataset.seat; syncPassengers(); render(); });
  }
  if(step.type==='passengers'){
    stage.querySelectorAll('.pax-naam').forEach(el=>el.oninput=e=>{ state.passengers[+e.target.dataset.idx].naam=e.target.value; updateNav(); });
    stage.querySelectorAll('.pax-slider').forEach(el=>{ setSlider(el); el.oninput=e=>{
      const idx=+e.target.dataset.idx; state.passengers[idx].gewicht=+e.target.value;
      const v=stage.querySelector('.pax-wval[data-idx="'+idx+'"]'); if(v) v.textContent=e.target.value;
      setSlider(e.target);
    }; });
  }
  if(step.type==='date'){ if(calYear===undefined) initCal(); drawCal();
    stage.querySelectorAll('.dsug').forEach(b=>b.onclick=()=>{ state.datum=b.dataset.iso; state.flexibel=false; const dd=new Date(state.datum+'T00:00'); calYear=dd.getFullYear(); calMonth=dd.getMonth(); render(); });
    const flex=stage.querySelector('#flexChip'); if(flex) flex.onclick=()=>{
      state.flexibel=!state.flexibel; if(state.flexibel) state.datum='';
      flex.setAttribute('aria-pressed',state.flexibel); drawCal(); updateNav();
    };
  }
  if(step.type==='form'){
    ['voornaam','achternaam','email','tel'].forEach(id=>{const el=stage.querySelector('#'+id); if(el) el.oninput=e=>{state[id]=e.target.value; updateNav();};});
  }

  updateNav();
}

function stepValid(){
  const step = steps[i];
  if(step.type==='seats') return state.aantal>=1;
  if(step.type==='passengers') return state.passengers.length===state.aantal && state.passengers.every(p=>p.naam.trim() && p.gewicht>0);
  if(step.type==='date') return !!(state.datum || state.flexibel);
  if(step.type==='form') return state.voornaam.trim() && state.achternaam.trim() && state.tel.trim().length>=6;
  if(step.type==='summary') return true;
  return true;
}

function updateNav(){
  backBtn.disabled = (i===0);
  nextBtn.textContent = (i===steps.length-1) ? 'Reserveer je stoel →' : 'Volgende';
  nextBtn.disabled = !stepValid();
  hint.style.visibility = stepValid()? 'visible':'hidden';
}

function next(){
  if(!stepValid()) return;
  if(i===steps.length-1){ submitReservatie(); return; }
  i++; nextBtn.style.display=''; render();
}
function back(){ if(i>0){ i--; nextBtn.style.display=''; render(); } }

async function submitReservatie(){
  nextBtn.disabled=true; nextBtn.textContent='Versturen…'; hint.style.visibility='hidden';
  const payload = { ...state, bron:'vlucht-per-stoel', totaal:state.aantal*150, gereserveerd_op:new Date().toISOString() };
  let ok = true;
  if(SUBMIT_ENDPOINT){
    try{ const r = await fetch(SUBMIT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); ok=r.ok; }
    catch(e){ ok=false; }
  } else { console.log('[Heli-Flights] Reservatie (geen SUBMIT_ENDPOINT ingesteld):', payload); }
  ok ? showSuccess() : showError();
}

function showSuccess(){
  const voornaam=(state.voornaam||'').trim();
  stepsBar.innerHTML = steps.map(()=>`<span class="seg done"></span>`).join('');
  stage.innerHTML = `<div class="screen enter" style="text-align:center;max-width:560px;">
    <span class="eyebrow" style="justify-content:center;width:100%"><span class="sq"></span>Reservatie verzonden</span>
    <h1 class="q" style="text-align:center">Tot in de <span class="imp">lucht</span>${voornaam?', '+esc(voornaam):''}.</h1>
    <p class="q-help" style="margin-left:auto;margin-right:auto">We bellen je op${state.tel? ' op <b>'+esc(state.tel)+'</b>':''} om je stoel(en) te bevestigen. De vlucht vertrekt bij 4 volzette stoelen; raakt ze niet vol of speelt het weer op, dan schuift je stoel door naar een volgende eerste zondag.</p>
  </div>`;
  backBtn.style.display='none'; nextBtn.style.display='none'; hint.style.visibility='hidden';
  stepCount.textContent='VERZONDEN';
}
function showError(){
  stage.innerHTML = `<div class="screen enter" style="max-width:560px;">
    <span class="eyebrow"><span class="sq"></span>Er ging iets mis</span>
    <h1 class="q">Reservatie <span class="imp">niet verstuurd</span></h1>
    <p class="q-help">Probeer het opnieuw. Lukt het niet, bel ons dan rechtstreeks — we helpen je meteen verder.</p>
  </div>`;
  nextBtn.style.display=''; nextBtn.disabled=false; nextBtn.textContent='Opnieuw proberen →'; hint.style.visibility='hidden';
}

nextBtn.addEventListener('click',next);
backBtn.addEventListener('click',back);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !nextBtn.disabled && nextBtn.style.display!=='none'){ next(); }
  if(e.key==='Escape'){ back(); }
});

render();
</script>
