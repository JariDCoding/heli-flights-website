<meta charset="utf-8">
<title>Initiatievlucht — Aanvraag · Heli-Flights</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --red:#AD0404; --red-dark:#8A0303;
    --ink:#1E1C1D; --white:#FFFFFF; --ground:#F3F3F4;
    --muted:#6E6C6D; --line:#DEDEDF; --line-2:#CBCBCC; --tint:#FBEDED;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--ground); color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased;
    font-size:17px; line-height:1.5; overflow:hidden;}
  .app{height:100dvh; display:flex; flex-direction:column;}

  .topbar{display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; border-bottom:1px solid var(--line); background:var(--white); flex:none;}
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.02em; font-size:15px;}
  .logo .mark{height:30px; width:auto; display:block; border-radius:3px;}
  .logo span{color:var(--muted); font-weight:700;}
  .step-count{font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--ink); font-variant-numeric:tabular-nums;}
  .step-count em{color:var(--muted); font-style:normal; font-weight:700;}

  /* segmented step indicator (streepjes = propellermotief) */
  .steps{display:flex; gap:4px; padding:12px 28px; background:var(--white); border-bottom:1px solid var(--line); flex:none;}
  .steps .seg{height:4px; flex:1; background:var(--line); border-radius:2px; transition:background .3s;}
  .steps .seg.done{background:var(--red);}

  .stage{flex:1; overflow-y:auto; display:flex; align-items:center; justify-content:center; padding:30px 24px;}
  .screen{width:100%; max-width:720px; margin:0 auto;}
  .screen.enter{animation:rise .4s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){ .screen.enter{animation:none;} .ph-dot{transition:none;} }

  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:800;
    letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-bottom:14px;}
  .eyebrow .sq{width:9px; height:9px; background:var(--red);}
  .eyebrow em{color:var(--muted); font-style:normal; font-weight:700;}

  h1.q{font-weight:500; letter-spacing:-.01em; line-height:1.12; font-size:clamp(24px,3.4vw,38px); text-wrap:balance;}
  h1.q .imp{font-weight:800; text-transform:uppercase; letter-spacing:-.01em;}
  .keyline{width:64px; height:2px; background:var(--red); margin-top:16px;}
  .q-help{color:var(--muted); font-size:16px; margin-top:14px; max-width:56ch;}

  .options{display:grid; gap:12px; margin-top:28px;}
  .opt{display:flex; align-items:center; gap:16px; width:100%; text-align:left; background:var(--white);
    border:1.5px solid var(--line); border-radius:3px; padding:18px 20px; cursor:pointer;
    font-family:inherit; font-size:17px; color:var(--ink); transition:border-color .15s, background .15s, transform .05s;}
  .opt:hover{border-color:var(--line-2);}
  .opt:active{transform:translateY(1px);}
  .opt .key{width:26px; height:26px; flex:none; border:1.5px solid var(--line-2); border-radius:3px;
    display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--muted);}
  .opt .txt{flex:1;}
  .opt .txt b{display:block; font-weight:700;}
  .opt .txt small{color:var(--muted); font-size:13.5px;}
  .opt .tick{width:22px; height:22px; flex:none; opacity:0; transition:opacity .15s;}
  .opt[aria-checked="true"]{border-color:var(--red); background:var(--tint);}
  .opt[aria-checked="true"] .key{background:var(--red); color:#fff; border-color:var(--red);}
  .opt[aria-checked="true"] .tick{opacity:1;}
  .opt.multi .key{border-radius:4px;}

  /* sliders / vliegprofiel */
  .profile{margin-top:30px; display:grid; gap:30px;}
  .metric-top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px;}
  .metric-label{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  .metric-sub{display:block; font-size:13px; color:var(--muted); font-weight:400; letter-spacing:0; text-transform:none; margin-top:2px;}
  .metric-val{font-weight:800; font-size:clamp(38px,6vw,54px); line-height:1; font-variant-numeric:tabular-nums;}
  .metric-val span{font-size:16px; font-weight:700; color:var(--muted); margin-left:4px;}
  .slider{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px; background:var(--line); outline:none; margin-top:14px;}
  .slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:28px; height:28px; border-radius:50%;
    background:var(--red); cursor:pointer; border:3px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.28);}
  .slider::-moz-range-thumb{width:28px; height:28px; border-radius:50%; background:var(--red); cursor:pointer; border:3px solid #fff;}
  .slider-ends{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-weight:600; margin-top:8px;}
  .confidential{display:flex; gap:10px; align-items:center; background:var(--white); border:1.5px solid var(--line);
    border-radius:3px; padding:14px 16px; font-size:13.5px; color:var(--muted);}
  .confidential .sq{width:9px;height:9px;background:var(--red);flex:none;}

  /* aircraft cards */
  .aircraft{display:grid; gap:14px; margin-top:28px;}
  .ac{position:relative; background:var(--white); border:1.5px solid var(--line); border-radius:4px; overflow:hidden; cursor:pointer; transition:border-color .15s, transform .05s;}
  .ac:hover{border-color:var(--line-2);}
  .ac:active{transform:translateY(1px);}
  .ac[aria-checked="true"]{border-color:var(--red);}
  .ac-img{height:170px; background:var(--ground); overflow:hidden; display:flex; align-items:center; justify-content:center; padding:8px 14px;}
  .ac-img img{max-width:100%; max-height:100%; object-fit:contain; display:block;}
  .ac-foot{display:flex; align-items:center; gap:14px; padding:16px 20px; border-top:1.5px solid var(--line);}
  .ac-main{flex:1;}
  .ac-name{font-weight:800; font-size:19px; letter-spacing:-.01em;}
  .ac-spec{color:var(--muted); font-size:13px; margin-top:2px;}
  .ac-check{width:24px; height:24px; flex:none; border-radius:50%; border:1.5px solid var(--line-2); display:grid; place-items:center;}
  .ac[aria-checked="true"] .ac-check{background:var(--red); border-color:var(--red);}
  .ac[aria-checked="true"] .ac-check svg{opacity:1;}
  .ac-check svg{opacity:0;}
  .badge{position:absolute; top:12px; left:12px; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:4px 9px; border-radius:3px; background:var(--ink); color:#fff; z-index:2;}
  .badge.rec{background:var(--red);}
  .toohevy-box{display:flex; gap:12px; margin-top:14px; padding:16px 18px; background:var(--tint); border-radius:3px; font-size:14px;}
  .toohevy-box .sq{width:9px;height:9px;background:var(--red);margin-top:5px;flex:none;}
  .cta-link{display:inline-flex; align-items:center; gap:10px; margin-top:18px; background:var(--red); color:#fff; text-decoration:none; font-weight:700; font-size:16px; padding:15px 26px; border-radius:3px;}
  .cta-link:hover{background:var(--red-dark);}

  .field{margin-top:22px;}
  .field label{display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  .field input{width:100%; padding:15px 16px; font-family:inherit; font-size:17px; color:var(--ink);
    background:var(--white); border:1.5px solid var(--line-2); border-radius:3px;}
  .field input::placeholder{color:#b3b1b2;}
  .field input:focus{outline:none; border-color:var(--red);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:560px){ .form-grid{grid-template-columns:1fr;} }

  .cal{background:var(--white); border:1.5px solid var(--line); border-radius:4px; padding:18px; max-width:390px; margin-top:26px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-title{font-weight:800; font-size:16px; text-transform:capitalize;}
  .cal-nav{width:36px;height:36px;border:1.5px solid var(--line-2); background:var(--white); border-radius:3px; cursor:pointer; font-size:18px; color:var(--ink); line-height:1;}
  .cal-nav:hover:not(:disabled){border-color:var(--red); color:var(--red);}
  .cal-nav:disabled{opacity:.3; cursor:not-allowed;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-dow{margin-bottom:8px;}
  .cal-dowc{text-align:center; font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase;}
  .cal-day{aspect-ratio:1; border:1.5px solid transparent; background:var(--white); border-radius:3px; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--ink); display:flex; align-items:center; justify-content:center;}
  .cal-day:hover:not(:disabled){border-color:var(--red); color:var(--red);}
  .cal-day:disabled{color:#d2d2d3; cursor:not-allowed;}
  .cal-day.sel{background:var(--red); color:#fff; border-color:var(--red);}
  .cal-empty{aspect-ratio:1;}
  .toggle-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .chip{padding:11px 16px; border:1.5px solid var(--line-2); background:var(--white); border-radius:999px;
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; color:var(--ink);}
  .chip[aria-pressed="true"]{border-color:var(--red); background:var(--tint); color:var(--red);}

  .info-box{margin-top:26px; background:var(--white); border:1.5px solid var(--line); border-left:3px solid var(--red); border-radius:3px; padding:22px 24px;}
  .info-box ul{list-style:none; display:grid; gap:12px;}
  .info-box li{display:flex; gap:12px; font-size:15px;}
  .info-box li .sq{width:8px; height:8px; background:var(--red); margin-top:7px; flex:none;}
  .info-note{margin-top:16px; font-size:13.5px; color:var(--muted);}

  .summary{margin-top:26px; background:var(--white); border:1.5px solid var(--line); border-radius:3px; overflow:hidden;}
  .summary .row{display:flex; justify-content:space-between; gap:16px; padding:14px 22px; border-bottom:1px solid var(--line); font-size:15px;}
  .summary .row:last-child{border-bottom:none;}
  .summary .row .k{color:var(--muted); font-weight:600;}
  .summary .row .v{font-weight:700; text-align:right;}
  .reassure{display:flex; gap:12px; margin-top:20px; padding:16px 20px; background:var(--tint); border-radius:3px; font-size:14px;}
  .reassure .sq{width:9px;height:9px;background:var(--red);margin-top:5px;flex:none;}

  .footer{display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 28px; border-top:1px solid var(--line); background:var(--white); flex:none;}
  .btn{font-family:inherit; font-weight:700; font-size:16px; cursor:pointer; border-radius:3px;
    padding:15px 30px; border:1.5px solid transparent; display:inline-flex; align-items:center; gap:10px;}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-primary:disabled{background:var(--line-2); color:#fff; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:transparent; padding-left:6px;}
  .btn-ghost:hover{color:var(--red);}
  .btn-ghost:disabled{opacity:0; pointer-events:none;}
  .hint{font-size:12px; color:var(--muted); margin-left:12px;}
  .hint b{color:var(--ink);}
  @media(max-width:560px){
    .hint{display:none;} .btn{padding:14px 20px; font-size:15px;}
    .topbar,.footer{padding-left:18px; padding-right:18px;}
    .steps{padding-left:18px; padding-right:18px;}
    .stage{padding:24px 18px;} .ac-img{height:130px;}
  }
</style>

<script>
const state = {
  vertrek:null, gewicht:80, lengte:178, toestel:null, formule:null,
  datum:'', flexibel:false, extras:[], gelegenheid:null,
  voornaam:'', achternaam:'', email:'', tel:''
};

function recommend(){
  const w=state.gewicht, h=state.lengte;
  if(w>120) return 'tooheavy';
  if(w<=95 && h<=190) return 'r22';
  return 'r44';
}

let steps = buildSteps();
let i = 0;
let calMonth, calYear;

const stage=document.getElementById('stage'), stepsBar=document.getElementById('stepsBar');
const backBtn=document.getElementById('backBtn'), nextBtn=document.getElementById('nextBtn');
const stepCount=document.getElementById('stepCount'), hint=document.getElementById('hint');

const tickSVG='<svg class="tick" width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11.5l4.5 4.5L18 6" stroke="#AD0404" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const checkWhite='<svg width="13" height="13" viewBox="0 0 22 22" fill="none"><path d="M4 11.5l4.5 4.5L18 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function esc(s){return (s||'').replace(/</g,'&lt;');}

const MONTHS=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const DOW=['ma','di','wo','do','vr','za','zo'];
function initCal(){const t=new Date(); if(state.datum){const d=new Date(state.datum+'T00:00'); calYear=d.getFullYear(); calMonth=d.getMonth();} else {calYear=t.getFullYear(); calMonth=t.getMonth();}}
function drawCal(){
  const wrap=document.getElementById('calWrap'); if(!wrap) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const first=new Date(calYear,calMonth,1); const start=(first.getDay()+6)%7;
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const atCur=(calYear===today.getFullYear()&&calMonth===today.getMonth());
  let h=`<div class="cal"><div class="cal-head">
    <button class="cal-nav" id="calPrev" ${atCur?'disabled':''}>‹</button>
    <div class="cal-title">${MONTHS[calMonth]} ${calYear}</div>
    <button class="cal-nav" id="calNext">›</button></div><div class="cal-grid cal-dow">`;
  DOW.forEach(d=>h+=`<span class="cal-dowc">${d}</span>`); h+=`</div><div class="cal-grid">`;
  for(let b=0;b<start;b++) h+=`<span class="cal-empty"></span>`;
  for(let d=1;d<=dim;d++){const dt=new Date(calYear,calMonth,d);
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    h+=`<button class="cal-day${state.datum===iso?' sel':''}" ${dt<today?'disabled':''} data-iso="${iso}">${d}</button>`;}
  h+=`</div></div>`; wrap.innerHTML=h;
  wrap.querySelector('#calPrev').onclick=()=>{if(calMonth===0){calMonth=11;calYear--;}else calMonth--; drawCal();};
  wrap.querySelector('#calNext').onclick=()=>{if(calMonth===11){calMonth=0;calYear++;}else calMonth++; drawCal();};
  wrap.querySelectorAll('.cal-day:not([disabled])').forEach(b=>b.onclick=()=>{state.datum=b.dataset.iso; state.flexibel=false;
    const fc=document.getElementById('flexChip'); if(fc) fc.setAttribute('aria-pressed','false'); drawCal(); updateNav();});
}

function setSlider(el){const min=+el.min,max=+el.max,v=+el.value; const pct=((v-min)/(max-min))*100;
  el.style.background=`linear-gradient(to right, var(--red) 0%, var(--red) ${pct}%, var(--line) ${pct}%, var(--line) 100%)`;}

function render(){
  steps=buildSteps(); if(i>=steps.length) i=steps.length-1;
  const step=steps[i]; stage.scrollTop=0;

  stepsBar.innerHTML=steps.map((s,k)=>`<span class="seg${k<=i?' done':''}"></span>`).join('');
  stepCount.innerHTML='STAP '+(i+1)+' <em>/ '+steps.length+'</em>';

  let html='<div class="screen enter">';
  html+=`<span class="eyebrow"><span class="sq"></span>${esc(step.label)}${step.optional?' <em>· optioneel</em>':''}</span>`;
  html+=`<h1 class="q">${step.q}</h1>`;
  if(step.help) html+=`<p class="q-help">${esc(step.help)}</p>`;

  if(step.type==='single'){
    html+='<div class="options">';
    step.options.forEach((o,idx)=>{const cur=(step.id==='gelegenheid')?state.gelegenheid:state[step.id]; const on=cur===o.v;
      html+=`<button class="opt" data-v="${o.v}" aria-checked="${on}"><span class="key">${String.fromCharCode(65+idx)}</span>
        <span class="txt"><b>${esc(o.b)}</b>${o.s?`<small>${esc(o.s)}</small>`:''}</span>${tickSVG}</button>`;});
    html+='</div>';
  }
  else if(step.type==='multi'){
    html+='<div class="options">';
    step.options.forEach(o=>{const on=state.extras.includes(o.v);
      html+=`<button class="opt multi" data-v="${o.v}" aria-checked="${on}"><span class="key">${on?'✓':''}</span>
        <span class="txt"><b>${esc(o.b)}</b>${o.s?`<small>${esc(o.s)}</small>`:''}</span>${tickSVG}</button>`;});
    html+='</div>';
  }
  else if(step.type==='profile'){
    html+=`<div class="profile">
      <div class="metric">
        <div class="metric-top"><div><span class="metric-label">Gewicht</span><span class="metric-sub">Voor de vliegbalans</span></div>
          <div class="metric-val"><span id="gVal">${state.gewicht}</span><span>kg</span></div></div>
        <input type="range" min="50" max="140" step="1" value="${state.gewicht}" id="gewicht" class="slider">
        <div class="slider-ends"><span>50 kg</span><span>140 kg</span></div>
      </div>
      <div class="metric">
        <div class="metric-top"><div><span class="metric-label">Lengte</span><span class="metric-sub">Voor de cockpitconfiguratie</span></div>
          <div class="metric-val"><span id="lVal">${state.lengte}</span><span>cm</span></div></div>
        <input type="range" min="150" max="210" step="1" value="${state.lengte}" id="lengte" class="slider">
        <div class="slider-ends"><span>150 cm</span><span>210 cm</span></div>
      </div>
      <div class="confidential"><span class="sq"></span>Uitsluitend voor de preflight-configuratie. Strikt vertrouwelijk.</div>
    </div>`;
  }
  else if(step.type==='aircraft'){
    const rec=recommend();
    if(rec==='tooheavy'){
      html+=`<div class="toohevy-box"><span class="sq"></span><span><b>Zelf vliegen kan helaas niet boven ± 120 kg.</b> Om veiligheids- en gewichtsredenen kan je de initiatievlucht niet zelf besturen. Geen zorgen — je geniet van hetzelfde uitzicht met een privé rondvlucht, en wij regelen alles op basis van je gegevens.</span></div>
        <a class="cta-link" href="/prive-rondvlucht-aanvraag/">Bekijk de privé rondvlucht →</a>`;
    } else {
      const cards=[
        {v:'r22', name:'Robinson R22', img:R22IMG, spec:'Tweezitter · tot ± 95 kg · het iconische lestoestel', badge:'Voordeligst'},
        {v:'r44', name:'Robinson R44', img:R44IMG, spec:'Vierzitter · tot ± 120 kg · krachtiger en ruimer', badge:'Meest gekozen'},
      ];
      html+='<div class="aircraft">';
      cards.forEach(c=>{const on=state.toestel===c.v; const isRec=(rec===c.v);
        html+=`<div class="ac" data-v="${c.v}" aria-checked="${on}">
          <span class="badge${isRec?' rec':''}">${isRec?'Aanbevolen voor jou':c.badge}</span>
          <div class="ac-img"><img src="${c.img}" alt="${c.name}"></div>
          <div class="ac-foot"><div class="ac-main"><div class="ac-name">${c.name}</div><div class="ac-spec">${c.spec}</div></div><div class="ac-check">${checkWhite}</div></div>
        </div>`;});
      html+='</div>';
    }
  }
  else if(step.type==='date'){
    html+=`<div id="calWrap"></div><div class="toggle-row">
      <button class="chip" id="flexChip" aria-pressed="${state.flexibel}">Ik ben flexibel / laat maar weten</button></div>`;
  }
  else if(step.type==='info'){
    html+='<div class="info-box"><ul>';
    step.items.forEach(it=>html+=`<li><span class="sq"></span><span>${esc(it)}</span></li>`);
    html+=`</ul></div><p class="info-note">${esc(step.note)}</p>`;
  }
  else if(step.type==='form'){
    html+=`<div class="form-grid">
        <div class="field"><label>Voornaam</label><input id="voornaam" value="${esc(state.voornaam)}" placeholder="Voornaam"></div>
        <div class="field"><label>Achternaam</label><input id="achternaam" value="${esc(state.achternaam)}" placeholder="Achternaam"></div></div>
      <div class="field"><label>Telefoonnummer</label><input id="tel" type="tel" value="${esc(state.tel)}" placeholder="+32 4.."></div>
      <div class="field"><label>E-mail <span style="text-transform:none;letter-spacing:0;font-weight:600">(optioneel)</span></label><input id="email" type="email" value="${esc(state.email)}" placeholder="jouw@email.be"></div>`;
  }
  else if(step.type==='summary'){
    const vertrekL=({basis:'Onze vaste basis',eigen:'Eigen locatie'})[state.vertrek]||'—';
    const toestelL=({r22:'Robinson R22',r44:'Robinson R44'})[state.toestel]||'—';
    const formuleL=({'30':'Briefing + 30 min zelf vliegen','60':'60 min — vliegen + sightseeing'})[state.formule]||'—';
    const extrasL=state.extras.length?state.extras.map(e=>({fotovideo:'Foto & video'})[e]).join(' · '):'Geen';
    html+=`<div class="summary">
      <div class="row"><span class="k">Vertrek</span><span class="v">${vertrekL}</span></div>
      <div class="row"><span class="k">Vliegprofiel</span><span class="v">${state.gewicht} kg · ${state.lengte} cm</span></div>
      <div class="row"><span class="k">Toestel</span><span class="v">${toestelL}</span></div>
      <div class="row"><span class="k">Formule</span><span class="v">${formuleL}</span></div>
      <div class="row"><span class="k">Datum</span><span class="v">${state.datum||(state.flexibel?'Flexibel':'—')}</span></div>
      <div class="row"><span class="k">Extra's</span><span class="v">${esc(extrasL)}</span></div>
    </div>
    <div class="reassure"><span class="sq"></span><span><b>Je zit nog nergens aan vast.</b> We bellen je binnenkort op om alles te bespreken en je vlucht te bevestigen. Bij slecht weer boeken we gratis om.</span></div>`;
  }
  html+='</div>'; stage.innerHTML=html;

  if(step.type==='date'){ if(calYear===undefined) initCal(); drawCal(); }
  if(step.type==='profile'){
    const g=document.getElementById('gewicht'), l=document.getElementById('lengte');
    setSlider(g); setSlider(l);
    g.oninput=e=>{state.gewicht=+e.target.value; document.getElementById('gVal').textContent=state.gewicht; setSlider(e.target);};
    l.oninput=e=>{state.lengte=+e.target.value; document.getElementById('lVal').textContent=state.lengte; setSlider(e.target);};
  }

  stage.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
    const v=el.dataset.v;
    if(step.type==='multi'){const idx=state.extras.indexOf(v); if(idx>=0) state.extras.splice(idx,1); else state.extras.push(v); render();}
    else{ if(step.id==='gelegenheid') state.gelegenheid=v; else state[step.id]=v;
      setTimeout(()=>{ if(i<steps.length-1){i++;} render(); },180); }
    updateNav();
  }));
  stage.querySelectorAll('.ac').forEach(el=>el.addEventListener('click',()=>{ state.toestel=el.dataset.v; render(); updateNav(); }));
  const flex=stage.querySelector('#flexChip'); if(flex) flex.onclick=()=>{state.flexibel=!state.flexibel; if(state.flexibel) state.datum=''; flex.setAttribute('aria-pressed',state.flexibel); drawCal(); updateNav();};
  ['voornaam','achternaam','email','tel'].forEach(id=>{const el=stage.querySelector('#'+id); if(el) el.oninput=e=>{state[id]=e.target.value; updateNav();};});

  updateNav();
}

function stepValid(){
  const step=steps[i];
  if(step.optional||['info','multi','profile','summary'].includes(step.type)) return true;
  if(step.type==='single') return !!(step.id==='gelegenheid'?state.gelegenheid:state[step.id]);
  if(step.type==='aircraft') return !!state.toestel;
  if(step.type==='date') return !!(state.datum||state.flexibel);
  if(step.type==='form') return state.voornaam.trim()&&state.achternaam.trim()&&state.tel.trim().length>=6;
  return true;
}
function updateNav(){
  backBtn.disabled=(i===0);
  nextBtn.textContent=(i===steps.length-1)?'Vraag je vlucht aan →':'Volgende';
  nextBtn.disabled=!stepValid(); hint.style.visibility=stepValid()?'visible':'hidden';
}
function next(){ if(!stepValid()) return; if(i===steps.length-1){submitAanvraag(); return;} i++; nextBtn.style.display=''; render(); }
function back(){ if(i>0){i--; nextBtn.style.display=''; render();} }

async function submitAanvraag(){
  nextBtn.disabled=true; nextBtn.textContent='Versturen…'; hint.style.visibility='hidden';
  const payload={...state, bron:'initiatievlucht', aangevraagd_op:new Date().toISOString()};
  let ok=true;
  if(SUBMIT_ENDPOINT){ try{const r=await fetch(SUBMIT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); ok=r.ok;}catch(e){ok=false;} }
  else { console.log('[Heli-Flights] Initiatievlucht-aanvraag (geen SUBMIT_ENDPOINT):', payload); }
  ok?showSuccess():showError();
}
function showSuccess(){
  const vn=(state.voornaam||'').trim();
  stepsBar.innerHTML=steps.map(()=>`<span class="seg done"></span>`).join('');
  stage.innerHTML=`<div class="screen enter" style="text-align:center;max-width:560px;">
    <span class="eyebrow" style="justify-content:center;width:100%"><span class="sq"></span>Aanvraag verzonden</span>
    <h1 class="q" style="text-align:center">Klaar voor de <span class="imp">stuurknuppel</span>${vn?', '+esc(vn):''}.</h1>
    <p class="q-help" style="margin-left:auto;margin-right:auto">We bellen je binnenkort op${state.tel? ' op <b>'+esc(state.tel)+'</b>':''} om je vlucht te bespreken en te bevestigen. Bij slecht weer boeken we gratis om.</p></div>`;
  backBtn.style.display='none'; nextBtn.style.display='none'; hint.style.visibility='hidden'; stepCount.textContent='VERZONDEN';
}
function showError(){
  stage.innerHTML=`<div class="screen enter" style="max-width:560px;">
    <span class="eyebrow"><span class="sq"></span>Er ging iets mis</span>
    <h1 class="q">Aanvraag <span class="imp">niet verstuurd</span></h1>
    <p class="q-help">Probeer het opnieuw. Lukt het niet, bel ons dan rechtstreeks — we helpen je meteen verder.</p></div>`;
  nextBtn.style.display=''; nextBtn.disabled=false; nextBtn.textContent='Opnieuw proberen →'; hint.style.visibility='hidden';
}

nextBtn.addEventListener('click',next); backBtn.addEventListener('click',back);
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!nextBtn.disabled&&nextBtn.style.display!=='none') next(); if(e.key==='Escape') back(); });
render();
</script>
